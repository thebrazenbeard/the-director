name: Director Local Reference Cross-Platform

on:
  pull_request:
    paths:
      - '.github/workflows/director-crossplatform.yml'
      - 'runtime/director/**'
      - 'tests/test_director_*.py'
      - 'examples/director_local_cycle.py'
      - 'README.md'

permissions:
  contents: read

jobs:
  local-reference:
    name: Director Python 3.12 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all Director and inherited root tests
        run: python -B -m unittest discover -s tests -q
      - name: Exercise the private temporary local cycle
        run: python -B -m examples.director_local_cycle
